# =====================================================================
# Configuración local de Supabase · ERP Segunda Compañía
# =====================================================================
project_id = "erp-segunda-compania"

[api]
enabled = true
port = 54321
schemas = [
  "public",
  "nucleo",
  "personal",
  "asistencia",
  "operaciones",
  "material",
  "tesoreria",
  "secretaria",
  "disciplina",
  "documentos"
]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/establecer"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[analytics]
enabled = false

[realtime]
enabled = false
